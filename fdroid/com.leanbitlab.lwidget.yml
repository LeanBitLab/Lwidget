AutoName: Lwidget
Summary: Ultra-lightweight, battery-friendly, privacy-first Material You widget
Description: |-
  Ultra-lightweight, battery-friendly, privacy-first Material You home screen widget.

  Features:
  * Time and Date display with custom font styles and formats
  * Calendar events integration (synced and local device calendars)
  * Tasks.org integration for active and overdue tasks
  * Local weather integration via Breezy Weather
  * Real-time battery level, temperature, and charging status
  * Built-in hardware pedometer step counter
  * Device storage and RAM monitors
  * Next alarm and world clock

